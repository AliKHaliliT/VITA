<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140" role="img" aria-label="VITA">
  <!-- The brand plaque: the pixel-mark beside a wordmark drawn as plain
       strokes (V, I, T, A are all straight-line letters, so no font is
       embedded). Self-contained on the dossier's charcoal card so it reads
       correctly on both GitHub themes. Colors follow the Rangefinder seed. -->
  <rect width="400" height="140" rx="10" fill="#1b1815"/>
  <rect x="36" y="40" width="26" height="26" fill="#efeae3"/>
  <rect x="70" y="40" width="26" height="26" fill="#ff7038"/>
  <rect x="104" y="40" width="26" height="26" fill="#efeae3"/>
  <rect x="36" y="74" width="26" height="26" fill="#efeae3"/>
  <rect x="70" y="74" width="26" height="26" fill="#efeae3"/>
  <rect x="104" y="74" width="26" height="26" fill="#8fc3d8"/>
  <g stroke="#efeae3" stroke-width="13" fill="none" stroke-linejoin="bevel">
    <path d="M168 40 L190 100 L212 40"/>
    <path d="M236 40 L236 100"/>
    <path d="M255 46.5 L299 46.5 M277 46.5 L277 100"/>
    <path d="M317 100 L339 40 L361 100 M328 78 L350 78"/>
