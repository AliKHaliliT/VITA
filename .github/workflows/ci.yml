name: CI

# Runs the commands AGENTS.md documents, plus the build, so the rules the tools hold are
# enforced rather than remembered.
# Every action is pinned to the commit it runs, with its version named beside it, because a tag is a
# name that moves, and the docs audit refuses a tag or a pin without its version.

# A push to a branch of this repository is that branch's run, so a job runs on a pull request only
# when the request comes from a fork, whose push never reaches this repository.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  landing:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    permissions:
      contents: read
      actions: read
    outputs:
      verified: ${{ steps.evidence.outputs.verified }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: No landed branch is left behind main
        run: |
          # A branch at main's own commit carries nothing main lacks and passes, which is where a worker whose
          # remote refuses a deletion leaves its branch between a landing and its next change. A branch main has
          # moved past is a landed branch left behind and fails.
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          stale=$(git for-each-ref --merged origin/main --no-contains origin/main --format='%(refname)' refs/remotes/origin | sed 's|^refs/remotes/||')
          if [ -n "$stale" ]; then
            echo "$stale"
            echo "A landed branch is left behind main; delete it locally and on the remote, since main has moved past it."
            exit 1
          fi
      - name: Evidence of a run this commit already passed
        id: evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A fast-forward keeps the commit, so a branch run that passed at this commit has seen this tree whole;
          # the gate is not repeated for it and only this landing check runs. Without that evidence the gate runs.
          passed=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=50" --jq '[.workflow_runs[] | select(.head_branch != "main" and .event == "push")] | length' 2>/dev/null || echo 0)
          if [ "${passed:-0}" -gt 0 ]; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
            echo "a branch run passed at ${GITHUB_SHA}, so the gate is not repeated; only the landing check ran"
          else
            echo "verified=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    runs-on: ubuntu-latest
    needs: landing
    if: ${{ needs.landing.outputs.verified != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Record immutability is checked against history, so the clone cannot be shallow.
          fetch-depth: 0
      - name: Pins
        # Each carried copy is pinned to the bytes it held at this project's last alignment, so red
        # here means a copy changed without a re-alignment; the pins move with each one. A move of the
        # style itself is invisible here and is found by reading the style. The audit scripts are
        # pinned beside the rulebook and checked before they run, because a checker the checked
        # project can edit is no checker at all.
        run: |
          echo "4c4abba28af927544a8219321a284bffb39711740dda0cd8a7f861ce5216d381  docs/CONVENTIONS.md" | sha256sum -c -
          echo "049b24904fc43e5d0de82ae8b8b41a54cb04fc1cf6b230f5898c8ea855d43e49  docs/LIVING.md" | sha256sum -c -
          echo "c21fb471857ae06254354e13672c9b2b8e28193429a655d3782e9e05039fe6d1  docs/RECORDS.md" | sha256sum -c -
          echo "457cdaad8da94808aa17c08f84a185ce1f3dc05f99f53c66b534483ad1094fa0  docs/PROSE.md" | sha256sum -c -
          echo "d8f5792afdfb43350cc5d705f37aded4cf59ff3029a78d84a992fa7ffe38a99c  scripts/audit-docs.mjs" | sha256sum -c -
          echo "260402797acf98c8ff95d2973f9a02b240900f80203389d0fca443e65783b9fc  scripts/audit-docs-selftest.mjs" | sha256sum -c -
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: |
          npm ci
          # The docs audit's spelling advisory runs where codespell is installed.
          pipx install codespell
      - name: Dependency audit, advisory
        continue-on-error: true
        # The tree the lock installs, read against the advisories the registry has published by the day of the
        # run; a finding is review's to fix or dismiss in writing.
        run: npm audit
      - name: Audit selftest
        run: node scripts/audit-docs-selftest.mjs
      - name: Edition selftest
        run: node scripts/cut-edition.mjs --selftest
      - name: Docs
        run: node scripts/audit-docs.mjs
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
